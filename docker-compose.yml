version: '3'

services:
    nginx:
        image: tiangolo/nginx-rtmp:latest
        container_name: 'nginx-mls'
        ports:
            - 8080:80
            - 1935:1935
        volumes:
            - ./nginx/nginx.conf:/etc/nginx/nginx.conf.template
            - .:/app
        depends_on:
            - php
        networks:
            - internal

    php:
        image: php:8.3-fpm-alpine
        container_name: 'php-mls'
        volumes:
            - .:/app
        networks:
            - internal

networks:
    internal:
        driver: bridge
